name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./school-PA-announcement-system
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        working-directory: ./school-PA-announcement-system
        run: npm run build

      - name: Initialize Capacitor
        working-directory: ./school-PA-announcement-system
        run: |
          npx cap init "School PA System" "org.school.pa" --web-dir dist
          npx cap add android

      - name: Configure Android Permissions and Security
        working-directory: ./school-PA-announcement-system
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin Duplicate Classes
        working-directory: ./school-PA-announcement-system
        run: |
          echo -e "\nconfigurations.all {\n    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\n    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\n    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\n}" >> android/app/build.gradle

      - name: Build Android APK
        working-directory: ./school-PA-announcement-system/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-PA-Android-App
          path: school-PA-announcement-system/android/app/build/outputs/apk/debug/app-debug.apk
